name: Temporary Meta Firming Ads Research

on:
  push:
    paths:
      - '.github/workflows/meta-firmeza-20260817-9f4b2c7e.yml'

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  RUN_KEY: meta-firmeza-20260817-9f4b2c7e

jobs:
  scrape:
    name: Scrape ${{ matrix.country }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        country: [ES, MX, CO]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser collector
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect active Meta Ad Library cards
        continue-on-error: true
        run: |
          mkdir -p work/out_${{ matrix.country }}
          python tmp/${RUN_KEY}/scrape.py --country '${{ matrix.country }}' --out work/out_${{ matrix.country }} | tee work/out_${{ matrix.country }}/run.log
      - name: Preserve country evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-evidence-${{ matrix.country }}
          path: work/out_${{ matrix.country }}/
          retention-days: 1
          if-no-files-found: warn

  aggregate:
    name: Build evidence report
    needs: scrape
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download country evidence
        uses: actions/download-artifact@v4
        with:
          pattern: meta-evidence-*
          path: work/all
          merge-multiple: false
      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 dateparser pillow pytesseract transformers sentencepiece
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Generate Markdown report
        run: |
          python tmp/${RUN_KEY}/aggregate.py \
            --root work/all \
            --out tmp/${RUN_KEY}/informe.md \
            --json-out tmp/${RUN_KEY}/evidence.json | tee tmp/${RUN_KEY}/aggregate.log
      - name: Publish temporary report for retrieval
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/${RUN_KEY}/informe.md tmp/${RUN_KEY}/evidence.json tmp/${RUN_KEY}/aggregate.log
          git commit -m 'chore: publish temporary Meta ads evidence report' || true
          git push
      - name: Keep retrieval window open
        run: sleep 1200
      - name: Remove temporary research files
        if: always()
        run: |
          git pull --rebase || true
          git rm -r tmp/${RUN_KEY} || true
          git rm .github/workflows/meta-firmeza-20260817-9f4b2c7e.yml || true
          git commit -m 'chore: remove temporary Meta ads research files' || true
          git push || true
